<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kehadiran Pegawai - PT PUTRA TIMUR JAYA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #00141f, #003c5c, #00897b);
      background-size: 300% 300%;
      animation: gradientMove 16s ease infinite;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 12px;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    .wrapper { width: 100%; max-width: 460px; }

    .brand-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: #e0fdf2;
      text-shadow: 0 0 8px rgba(0,0,0,0.4);
    }
    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      background: #e0fdf2;
      box-shadow: 0 0 16px rgba(0,255,200,0.65);
    }
    .brand-name {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 13px;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(18px);
      width: 100%;
      border-radius: 22px;
      padding: 22px 18px 18px;
      box-shadow:
        0 25px 40px rgba(0, 0, 0, 0.35),
        0 0 20px rgba(0, 255, 200, 0.3);
      border: 1px solid rgba(255,255,255,0.55);
    }

    h2 {
      text-align: center;
      color: #0f172a;
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 16px;
    }

    label {
      font-size: 13px;
      margin-bottom: 4px;
      color: #374151;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
      background: #f9fafb;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px #2563eb33;
      background: #ffffff;
    }
    input[readonly] { background: #f3f4f6; }

    /* warna dropdown keterangan */
    #ket { transition: background 0.2s, color 0.2s, border-color 0.2s; color:#111827; }
    .status-masuk { background:#dcfce7!important; border-color:#16a34a!important; color:#14532d!important; }
    .status-libur { background:#fee2e2!important; border-color:#dc2626!important; color:#7f1d1d!important; }
    .status-cuti  { background:#dbeafe!important; border-color:#2563eb!important; color:#1e3a8a!important; }
    .status-sakit { background:#fef3c7!important; border-color:#f59e0b!important; color:#92400e!important; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
      margin-top: -4px;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      border-width: 1px;
      border-style: solid;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .b-masuk { background:#dcfce7; border-color:#16a34a; color:#14532d; }
    .b-libur { background:#fee2e2; border-color:#dc2626; color:#7f1d1d; }
    .b-cuti  { background:#dbeafe; border-color:#2563eb; color:#1e3a8a; }
    .b-sakit { background:#fef3c7; border-color:#f59e0b; color:#92400e; }

    video, canvas, img {
      width: 100%;
      border-radius: 12px;
    }
    video {
      background: #020617;
      max-height: 220px;
      object-fit: cover;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.01em;
    }
    .btn-camera { background:#020617; color:white; }
    .btn-masuk  { background:#2563eb; color:white; }
    .btn-pulang { background:#10b981; color:white; }
    .btn-login  { background:#0ea5e9; color:white; }
    .btn-logout { background:#ef4444; color:white; }
    .btn-rekap  { background:#0f766e; color:white; }
    .btn:hover  { filter: brightness(1.05); }

    .small { font-size: 12px; color: #6b7280; }
    #statusMsg { margin-top: 8px; min-height: 16px; }

    #loginInfo {
      font-size: 12px;
      color: #065f46;
      font-weight: 600;
      margin-bottom: 6px;
      display:none;
    }
    #logoutBtn { display:none; }

    hr { border:none; border-top:1px dashed #e5e7eb; margin:10px 0 14px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- HEADER BRAND -->
    <div class="brand-bar">
      <img src="logo-pttj.png" alt="Logo PT PUTRA TIMUR JAYA" class="brand-logo">
      <span class="brand-name">PT PUTRA TIMUR JAYA</span>
    </div>

    <div class="card">
      <h2>Kehadiran Pegawai</h2>

      <!-- LOGIN -->
      <div id="loginSection">
        <label>Login Teknisi</label>
        <input id="loginUser" placeholder="User ID">
        <input id="loginPass" type="password" placeholder="Password">
        <button class="btn btn-login" type="button" onclick="handleLogin()">🔑 Login</button>
        <div class="small" style="margin-top:6px;">
          Hanya Teknisi Putija Yag Dapat Mengakses Kehadiran
        </div>
        <hr>
      </div>

      <div id="loginInfo"></div>
      <button id="logoutBtn" class="btn btn-logout" type="button" onclick="handleLogout()">🚪 Logout</button>

      <!-- FORM ABSENSI -->
      <div id="absenSection" style="display:none; margin-top:10px;">

        <label>Divisi</label>
        <select id="divisiSelect" disabled>
          <option value="">-- Pilih Divisi --</option>
          <option value="TEKNISI_ASSURANCE">TEKNISI_ASSURANCE</option>
          <option value="TEKNISI_PROVISIONING">TEKNISI_PROVISIONING</option>
          <option value="TEKNISI_REBOND">TEKNISI_REBOND</option>
          <option value="TEKNISI_MAINTENATE">TEKNISI_MAINTENATE</option>
		  <option value="ADMIN">ADMIN</option>
		  <option value="LEADER">LEADER</option>
		  <option value="KACAB">KACAB</option>
        </select>

        <label>Nama</label>
        <select id="namaSelect" disabled>
          <option value="">-- Pilih Pegawai --</option>
        </select>

        <label>NIK</label>
        <input id="nik" placeholder="NIK otomatis" readonly>

        <label>Area Kerja</label>
        <select id="area">
          <option value="">-- Pilih Area Kerja --</option>
          <option value="CMI,NJG,BTJ,CLL,GNH">CMI,NJG,BTJ,CLL,GNH</option>
          <option value="CMI,NJG">CMI,NJG</option>
          <option value="BTJ,CLL,GNH">BTJ,CLL,GNH</option>
        </select>

        <label>Keterangan</label>
        <select id="ket">
          <option value="masuk">Masuk</option>
          <option value="libur">Libur</option>
          <option value="cuti">Cuti</option>
          <option value="sakit">Sakit</option>
        </select>

        <div class="legend">
          <span class="badge b-masuk">Masuk = Hijau</span>
          <span class="badge b-libur">Libur = Merah</span>
          <span class="badge b-cuti">Cuti = Biru</span>
          <span class="badge b-sakit">Sakit = Kuning</span>
        </div>

        <!-- KETERANGAN TAMBAHAN -->
        <label for="note">Keterangan tambahan</label>
        <textarea id="note" rows="2" style="
          width:100%;
          padding:8px 10px;
          border-radius:10px;
          border:1px solid #d1d5db;
          font-size:13px;
          resize:vertical;
          margin-bottom:10px;
        " placeholder="Contoh: Sehat,Masuk Siang,Ijin keluarga,Meriang dll."></textarea>

        <label>Foto Kehadiran</label>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="preview" style="display:none; margin-top:5px;">

        <button class="btn btn-camera" type="button" onclick="ambilFoto()">📸 Ambil Foto</button>

        <label>Lokasi GPS</label>
        <div id="lokasi" class="small">Mengambil lokasi...</div>

        <button class="btn btn-masuk"  type="button" onclick="kirimAbsensi('masuk')">✅ Absen </button>
        <button class="btn btn-pulang" type="button" onclick="kirimAbsensi('pulang')">🏁 Absen Pulang</button>

        <!-- REKAP ABSEN -->
        <div style="margin-top:14px; padding-top:10px; border-top:1px dashed #e5e7eb;">
          <label>Rekap Kehadiran (maksimal 30 hari)</label>
          <div style="display:flex; gap:8px; margin-bottom:6px;">
            <input type="date" id="rekapFrom" style="flex:1; padding:6px 8px; border-radius:10px; border:1px solid #d1d5db;">
            <input type="date" id="rekapTo"   style="flex:1; padding:6px 8px; border-radius:10px; border:1px solid #d1d5db;">
          </div>
          <button class="btn btn-rekap" type="button" onclick="lihatRekap()">📊 Lihat Rekap</button>
          <div id="rekapInfo" class="small" style="margin-top:6px;"></div>
          <div id="rekapDetail" class="small" style="margin-top:4px; max-height:180px; overflow-y:auto;"></div>
        </div>

        <div id="statusMsg" class="small"></div>
      </div>
    </div>
  </div>

    PEGAWAI.forEach(p => {
      if (p.divisi === divisi) {
        const opt = document.createElement("option");
        opt.value = p.nama;
        opt.textContent = p.nama;
        opt.dataset.nik = p.nik;
        namaSelect.appendChild(opt);
      }
    });
  }
  function onNamaChange() {
    const opt = namaSelect.options[namaSelect.selectedIndex];
    nikInput.value = opt && opt.dataset.nik ? opt.dataset.nik : "";
  }
  divisiSelect.addEventListener("change", refreshNamaOptions);
  namaSelect.addEventListener("change", onNamaChange);

  // ===== Warna dropdown Keterangan =====
  function updateKetClass() {
    ketSelect.classList.remove("status-masuk","status-libur","status-cuti","status-sakit");
    if (ketSelect.value === "masuk")      ketSelect.classList.add("status-masuk");
    else if (ketSelect.value === "libur") ketSelect.classList.add("status-libur");
    else if (ketSelect.value === "cuti")  ketSelect.classList.add("status-cuti");
    else if (ketSelect.value === "sakit") ketSelect.classList.add("status-sakit");
  }
  ketSelect.addEventListener("change", updateKetClass);
  updateKetClass();

  // ===== REKAP: set tanggal default 30 hari terakhir =====
  function setDefaultRekapDates() {
    if (!rekapFrom || !rekapTo) return;
    const today = new Date();
    const toStr = today.toISOString().slice(0, 10);
    const from = new Date();
    from.setDate(today.getDate() - 29);
    const fromStr = from.toISOString().slice(0, 10);
    rekapFrom.value = fromStr;
    rekapTo.value   = toStr;
  }

  // ===== LOGIN / LOGOUT =====
  function handleLogin() {
    const u = loginUserInp.value.trim();
    const p = loginPassInp.value.trim();
    if (!u || !p) {
      alert("User ID dan Password wajib diisi.");
      return;
    }

    let found = null;
    USERS.forEach(acc => {
      if (acc.username.toLowerCase() === u.toLowerCase() && acc.password === p) {
        found = acc;
      }
    });

    if (!found) {
      alert("User ID atau Password salah.");
      return;
    }

    currentUser = found;

    // set divisi & nama sesuai user
    divisiSelect.value = currentUser.divisi;
    refreshNamaOptions();
    for (let i = 0; i < namaSelect.options.length; i++) {
      if (namaSelect.options[i].value === currentUser.nama) {
        namaSelect.selectedIndex = i;
        break;
      }
    }
    onNamaChange();

    // set area default
    if (currentUser.defaultArea) {
      areaInput.value = currentUser.defaultArea;
    }

    loginInfo.style.display = "block";
    loginInfo.textContent = "Login sebagai: " + currentUser.nama + " (" + currentUser.divisi + ")";
    loginSection.style.display = "none";
    absenSection.style.display = "block";
    logoutBtn.style.display = "block";

    statusMsg.textContent = "";
    preview.style.display = "none";
    canvas.width = canvas.height = 0;

    setDefaultRekapDates();
    rekapInfo.textContent  = "";
    rekapDetail.innerHTML  = "";
  }

  function handleLogout() {
    currentUser = null;
    loginUserInp.value = "";
    loginPassInp.value = "";

    divisiSelect.value = "";
    refreshNamaOptions();
    areaInput.value = "";
    ketSelect.value = "masuk";
    updateKetClass();
    noteInput.value = "";
    preview.style.display = "none";
    canvas.width = canvas.height = 0;
    statusMsg.textContent = "";

    if (rekapInfo)   rekapInfo.textContent = "";
    if (rekapDetail) rekapDetail.innerHTML = "";

    loginSection.style.display = "block";
    absenSection.style.display = "none";
    logoutBtn.style.display = "none";
    loginInfo.style.display = "none";
  }

  // ===== Kamera =====
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video:true })
      .then(stream => {
        cameraAvailable = true;
        video.srcObject = stream;
      })
      .catch(err => {
        cameraAvailable = false;
        statusMsg.textContent = "Gagal akses kamera: " + err.message;
      });
  } else {
    statusMsg.textContent = "Browser tidak mendukung kamera.";
  }

  function ambilFoto() {
    if (!currentUser) {
      alert("Silakan login terlebih dahulu.");
      return;
    }
    if (!cameraAvailable || !video.videoWidth || !video.videoHeight) {
      alert("Kamera tidak aktif / ditolak.");
      return;
    }
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL("image/jpeg");
    preview.src = dataUrl;
    preview.style.display = "block";
	preview.dataset.ready = "1";
    alert("Kasep pisan tos masuk photona !");
  }

  // ===== Lokasi =====
  if ("geolocation" in navigator) {
  navigator.geolocation.getCurrentPosition(
    pos => {
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
      lokasi.textContent =
        "Lat: " + lat.toFixed(6) + ", Lon: " + lon.toFixed(6);
    },
    err => {
      lokasi.textContent = "Lokasi gagal: " + err.message;
    }
  );
} else {
  lokasi.textContent = "Browser tidak mendukung lokasi.";
}

/* ===== GPS KHUSUS ABSEN PULANG ===== */
function ambilLokasiPulang(callback) {
  if (!("geolocation" in navigator)) {
    alert("Browser tidak mendukung GPS.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      latPulang = pos.coords.latitude;
      lonPulang = pos.coords.longitude;
      if (callback) callback();
    },
    err => {
      alert("Gagal ambil lokasi pulang: " + err.message);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

  function resetFormAfterSend() {
    areaInput.value = currentUser && currentUser.defaultArea ? currentUser.defaultArea : "";
    ketSelect.value = "masuk";
    updateKetClass();
    noteInput.value = "";
    preview.style.display = "none";
    canvas.width = 0;
    canvas.height = 0;
    statusMsg.textContent = "";
  }
  


  // ===== URL WEB APP (GANTI DENGAN punyamu) =====
  const FETCH_URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxomZTLRZZ69y-2iKIieCqCf8jbTfGpu5BhSFOecq3pdkSRqgw8Aei6Ja9c0EPX_e9f/exec";

// ===== Kirim Absensi (FINAL & FIX) =====
function kirimAbsensi(mode) {
  if (!currentUser) {
    alert("Silakan login terlebih dahulu.");
    return;
  }

  const divisi = divisiSelect.value.trim();
  const nama   = namaSelect.value.trim();
  const nik    = nikInput.value.trim();
  const area   = areaInput.value.trim();
  const ket    = ketSelect.value;
  const note   = noteInput.value.trim();

  if (!divisi || !nama || !nik || !area) {
    alert("Divisi, Nama, NIK, dan Area Kerja wajib diisi.");
    return;
  }

  // ================= FOTO =================
  let fotoBase64 = "";

  // 🔒 KHUSUS PULANG: WAJIB FOTO BARU
  if (mode === "pulang") {
    if (preview.dataset.ready !== "1") {
      alert("❌ Absen pulang WAJIB Pake Photo Baru atuh.");
      return;
    }
  } else {
    // masuk: boleh tanpa foto
    if (!canvas.width || !canvas.height) {
      const lanjut = confirm("Photo heula Kasep Wajib. Lanjut Absen teu ngangge Photo?");
      if (!lanjut) return;
    }
  }

  if (canvas.width && canvas.height) {
    fotoBase64 = canvas.toDataURL("image/jpeg").split(",")[1];
  }

  // ================= GPS & FETCH =================
  statusMsg.textContent =
    mode === "pulang"
      ? "Mengambil lokasi pulang..."
      : "Mengirim absensi...";

  if (mode === "pulang") {
    ambilLokasiPulang(kirimFetch);
  } else {
    kirimFetch();
  }

  function kirimFetch() {
    fetch(FETCH_URL_WEB_APP, {
      method: "POST",
      body: JSON.stringify({
        mode  : mode,
        nik   : nik,
        nama  : nama,
        area  : area,
        divisi: divisi,
        ket   : ket,
        note  : note,
        photo : fotoBase64,
        lat   : mode === "pulang" ? latPulang : lat,
        lon   : mode === "pulang" ? lonPulang : lon
      })
    })
    .then(res => res.text())
    .then(text => {
      statusMsg.textContent = "Respon server: " + text;

      if (text.startsWith("ERROR")) {
        alert(text);
        return;
      }

      alert("Kehadiran " + mode + " terkirim!");
      resetFormAfterSend();

      // reset penanda
      preview.dataset.ready = "";
      latPulang = "";
      lonPulang = "";
    })
    .catch(err => {
      alert("Gagal kirim absensi.");
    });
  }
}

  // ===== LIHAT REKAP ABSENSI =====
  function lihatRekap() {
    if (!currentUser) {
      alert("Silakan login terlebih dahulu.");
      return;
    }
    const from = rekapFrom.value;
    const to   = rekapTo.value;

    if (!from || !to) {
      alert("Silakan isi tanggal dari dan sampai.");
      return;
    }

    const fromDate = new Date(from + "T00:00:00");
    const toDate   = new Date(to   + "T23:59:59");
    const diffMs   = toDate - fromDate;
    const diffHari = diffMs / (1000 * 60 * 60 * 24) + 1;
    if (diffHari <= 0) {
      alert("Tanggal sampai harus >= tanggal dari.");
      return;
    }
    if (diffHari > 30) {
      alert("Rentang maksimal 30 hari.");
      return;
    }

    rekapInfo.textContent  = "Mengambil data rekap...";
    rekapDetail.innerHTML  = "";
	const REQUIRE_PHOTO_PULANG = true;
	
    fetch(FETCH_URL_WEB_APP, {
      method: "POST",
      body: JSON.stringify({
        mode: "rekap",
        nama: currentUser.nama,
        from: from,
        to:   to
      })
    })
    .then(res => res.json())
    .then(data => {
      if (!data.ok) {
        rekapInfo.textContent = "Gagal ambil rekap: " + (data.error || "Unknown error");
        return;
      }
      rekapInfo.textContent =
        "Rekap " + currentUser.nama +
        " (" + from + " s/d " + to + ") - Total hari: " + data.totalHari +
        " | Masuk: " + data.totalMasuk +
        ", Libur: " + data.totalLibur +
        ", Cuti: " + data.totalCuti +
        ", Sakit: " + data.totalSakit;

      if (!data.rows || !data.rows.length) {
        rekapDetail.innerHTML = "<em>Tidak ada data di rentang tanggal ini.</em>";
        return;
      }

      let html = "<table style='width:100%; border-collapse:collapse; font-size:11px; margin-top:4px;'>";
      html += "<tr style='background:#f3f4f6;'><th style='padding:4px; border-bottom:1px solid #e5e7eb;'>Tanggal</th><th style='padding:4px; border-bottom:1px solid #e5e7eb;'>Keterangan</th></tr>";
      data.rows.forEach(r => {
        html += "<tr>" +
          "<td style='padding:3px 4px; border-bottom:1px solid #f1f5f9;'>" + r.date + "</td>" +
          "<td style='padding:3px 4px; border-bottom:1px solid #f1f5f9; text-transform:capitalize;'>" + r.ket + "</td>" +
        "</tr>";
      });
      html += "</table>";
      rekapDetail.innerHTML = html;
    })
    .catch(err => {
      rekapInfo.textContent = "Gagal ambil rekap: " + err.message;
    });
  }

  // expose ke window
  window.handleLogin  = handleLogin;
  window.handleLogout = handleLogout;
  window.ambilFoto    = ambilFoto;
  window.kirimAbsensi = kirimAbsensi;
  window.lihatRekap   = lihatRekap;
</script>
</body>
</html>
